backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "contenu"
    label: "Contenu du Site"
    files:
      - file: "content.json"
        label: "Informations du Pays"
        name: "infos"
        fields:
          - { label: "Nom du Pays", name: "nom_pays", widget: "string" }
          - { label: "Serveur NG", name: "serveur", widget: "string" }
          - { label: "Slogan", name: "slogan", widget: "string" }
          - { label: "Histoire / Lore", name: "lore_text", widget: "markdown" }
          - { label: "Lien Discord", name: "discord_link", widget: "string" }