backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "content"
    label: "Contenu du site"
    files:
      - file: "content.json"
        label: "Tableau de Bord & Gestion Globale"
        name: "info"
        fields:
          # --- ⚙️ INFORMATIONS GÉNÉRALES ---
          - { label: "Nom du Pays", name: "country_name", widget: "string" }
          - { label: "Nom du Serveur", name: "server_name", widget: "string" }
          - { label: "Slogan", name: "slogan", widget: "string" }
          - { label: "Description / Message d'accueil", name: "description", widget: "text" }
          - { label: "Lien Discord", name: "discord_link", widget: "string" }

          # --- 📊 STATISTIQUES DU PAYS ---
          - label: "Statistiques du Pays"
            name: "stats"
            widget: "object"
            fields:
              - { label: "Niveau du Pays (Level)", name: "level", widget: "number" }
              - { label: "Notations / Note globale", name: "rating", widget: "string" }
              - { label: "Nombre de Claims", name: "claims", widget: "number" }
              - { label: "MMR", name: "mmr", widget: "number" }
              - { label: "Power (ex: 180/200)", name: "power", widget: "string" }
              - { label: "Date de création", name: "created_at", widget: "string" }
              - { label: "Nombre de joueurs", name: "players_count", widget: "number" }
              - { label: "Solde en Banque ($)", name: "bank_balance", widget: "string" }

          # --- 🏛️ MINISTÈRES & GOUVERNEMENT ---
          - label: "Ministères & Cadres"
            name: "ministries"
            widget: "list"
            summary: "{{fields.name}} - {{fields.player}}"
            fields:
              - { label: "Nom du Ministère / Rôle", name: "name", widget: "string" }
              - { label: "Pseudo Minecraft", name: "player", widget: "string" }
              - { label: "Missions / Description", name: "description", widget: "text" }

          # --- 🔬 RECHERCHE & DÉVELOPPEMENT (R&D) ---
          - label: "Recherche & Développement"
            name: "rd_branches"
            widget: "object"
            fields:
              - label: "Général"
                name: "general"
                widget: "list"
                summary: "{{fields.title}} ({{fields.progress}}%)"
                fields:
                  - { label: "Projet", name: "title", widget: "string" }
                  - { label: "Progression (%)", name: "progress", widget: "number" }
              - label: "Ressources"
                name: "resources"
                widget: "list"
                summary: "{{fields.title}} ({{fields.progress}}%)"
                fields:
                  - { label: "Projet", name: "title", widget: "string" }
                  - { label: "Progression (%)", name: "progress", widget: "number" }
              - label: "Industrie"
                name: "industry"
                widget: "list"
                summary: "{{fields.title}} ({{fields.progress}}%)"
                fields:
                  - { label: "Projet", name: "title", widget: "string" }
                  - { label: "Progression (%)", name: "progress", widget: "number" }
              - label: "Militaire"
                name: "military"
                widget: "list"
                summary: "{{fields.title}} ({{fields.progress}}%)"
                fields:
                  - { label: "Projet", name: "title", widget: "string" }
                  - { label: "Progression (%)", name: "progress", widget: "number" }
              - label: "Technologie"
                name: "technology"
                widget: "list"
                summary: "{{fields.title}} ({{fields.progress}}%)"
                fields:
                  - { label: "Projet", name: "title", widget: "string" }
                  - { label: "Progression (%)", name: "progress", widget: "number" }

          # --- 🗺️ PARCELLES & TERRITOIRES ---
          - label: "Gestion des Parcelles"
            name: "parcels"
            widget: "list"
            summary: "{{fields.name}} ({{fields.status}})"
            fields:
              - { label: "Nom/Numéro de Parcelle", name: "name", widget: "string" }
              - { label: "Coordonnées (X, Z)", name: "coords", widget: "string" }
              - { label: "Prix ($)", name: "price", widget: "number" }
              - { label: "Statut", name: "status", widget: "select", options: ["Libre", "Acheter", "Réservé", "Occupé"] }
              - { label: "Propriétaire (Pseudo)", name: "owner", widget: "string", required: false }

          # --- 🛒 BOUTIQUE & COMMANDES ---
          - label: "Boutique & Commandes"
            name: "shop"
            widget: "list"
            summary: "{{fields.category_name}}"
            fields:
              - { label: "Nom de la sous-section (ex: Minerais, Armes, Consommables...)", name: "category_name", widget: "string" }
              - label: "Articles"
                name: "items"
                widget: "list"
                summary: "{{fields.item_name}} - {{fields.price}}"
                fields:
                  - { label: "Nom de l'item", name: "item_name", widget: "string" }
                  - { label: "Prix ($)", name: "price", widget: "string" }
                  - { label: "Format / Quantité (ex: /stack, /unité, Sur commande)", name: "unit", widget: "string" }
                  - { label: "Description (facultatif)", name: "description", widget: "string", required: false }
                  - { label: "Statut", name: "status", widget: "select", options: ["En Stock", "Rupture", "Sur Commande"], default: "En Stock" }

          # --- 📄 ONGLETS & PAGES SUR MESURE ---
          - label: "Autres Onglets Personnalisés"
            name: "tabs"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Titre de l'onglet", name: "title", widget: "string" }
              - { label: "Identifiant unique (en minuscules, ex: lore)", name: "id", widget: "string" }
              - { label: "Contenu (Texte ou Markdown)", name: "content", widget: "markdown" }
