backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "content"
    label: "Contenu du site"
    files:
      - file: "content.json"
        label: "Informations Principales"
        name: "info"
        fields:
          - label: "Nom du Pays"
            name: "country_name"
            widget: "string"
          - label: "Slogan"
            name: "slogan"
            widget: "string"
          - label: "Description / Lore"
            name: "description"
            widget: "text"
          - label: "Lien Discord"
            name: "discord_link"
            widget: "string"

          # --- NOUVEAU : GESTION DES ONGLETS DYNAMIQUES ---
          - label: "Onglets du site"
            name: "tabs"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Titre de l'onglet", name: "title", widget: "string" }
              - { label: "Contenu de la page", name: "content", widget: "markdown" }
