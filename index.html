<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="site-title">Nom du Pays</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

  <!-- EN-TÊTE DU SITE -->
  <header>
    <div class="logo" id="header-logo">[NOM DU PAYS]</div>
    <nav>
      <ul id="nav-tabs">
        <!-- Les onglets s'insèreront automatiquement ici -->
      </ul>
    </nav>
  </header>

  <!-- CONTENU DE LA PAGE -->
  <main class="container">
    <div id="main-content" class="card">
      <!-- Le contenu dynamique s'affichera ici -->
    </div>
  </main>

  <script>
    // Chargement dynamique des données depuis content.json
    fetch('content.json')
      .then(response => response.json())
      .then(data => {
        // 1. Mise à jour des textes globaux
        document.getElementById('site-title').innerText = data.country_name;
        document.getElementById('header-logo').innerText = data.country_name.toUpperCase();

        const navUl = document.getElementById('nav-tabs');
        const mainContent = document.getElementById('main-content');

        // Onglet ACCUEIL (Par défaut)
        function showHome() {
          mainContent.innerHTML = `
            <h1>Bienvenue en ${data.country_name}</h1>
            <p class="subtitle"><em>"${data.slogan}"</em></p>
            <p>${data.description.replace('NationsGlory [Nom du Serveur]', 'NationsGlory ' + data.server_name)}</p>
            <br>
            <a href="${data.discord_link}" target="_blank" class="btn-discord">REJOINDRE LE DISCORD OFFICIEL</a>
          `;
          updateActiveNav('home');
        }

        // Création du bouton Accueil dans la nav
        const homeLi = document.createElement('li');
        homeLi.innerHTML = `<a href="#" id="nav-home" class="active">Accueil</a>`;
        homeLi.onclick = (e) => { e.preventDefault(); showHome(); };
        navUl.appendChild(homeLi);

        // 2. Génération dynamique de tous tes autres onglets
        if (data.tabs && data.tabs.length > 0) {
          data.tabs.forEach(tab => {
            const li = document.createElement('li');
            li.innerHTML = `<a href="#" id="nav-${tab.id}">${tab.title}</a>`;
            li.onclick = (e) => {
              e.preventDefault();
              mainContent.innerHTML = `<h1>${tab.title}</h1><div>${tab.content}</div>`;
              updateActiveNav(tab.id);
            };
            navUl.appendChild(li);
          });
        }

        function updateActiveNav(activeId) {
          document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
          const current = document.getElementById(`nav-${activeId}`);
          if (current) current.classList.add('active');
        }

        // Afficher l'accueil au chargement
        showHome();
      });
  </script>

  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
