<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="site-title">Nom du Pays</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

  <!-- EN-TÊTE DU SITE -->
  <header>
    <div class="logo" id="header-logo">[NOM DU PAYS]</div>
    <nav>
      <ul id="nav-tabs">
        <!-- Les onglets s'insèreront automatiquement ici -->
      </ul>
    </nav>
  </header>

  <!-- CONTENU DE LA PAGE -->
  <main class="container">
    <div id="main-content" class="card">
      <!-- Le contenu dynamique s'affichera ici -->
    </div>
  </main>

<script>
  // Chargement dynamique des données depuis content.json sans toucher au style
  fetch('content.json')
    .then(response => response.json())
    .then(data => {
      // 1. Mise à jour des textes
      if (data.country_name) {
        document.querySelectorAll('.logo, header h1, [id*="logo"]').forEach(el => {
          el.innerText = data.country_name.toUpperCase();
        });
      }

      const navUl = document.querySelector('nav ul');
      const mainContent = document.querySelector('.card, main');

      if (navUl && mainContent) {
        // Vider la navigation pour la reconstruire dynamiquement
        navUl.innerHTML = '';

        // Bouton ACCUEIL
        const homeLi = document.createElement('li');
        homeLi.innerHTML = `<a href="#" class="active">Accueil</a>`;
        homeLi.onclick = (e) => {
          e.preventDefault();
          location.reload(); // Recharge la page pour revenir au contenu de base
        };
        navUl.appendChild(homeLi);

        // Ajout dynamique de tous les autres onglets créés dans l'Admin
        if (data.tabs && data.tabs.length > 0) {
          data.tabs.forEach(tab => {
            const li = document.createElement('li');
            li.innerHTML = `<a href="#">${tab.title}</a>`;
            li.onclick = (e) => {
              e.preventDefault();
              
              // Mettre à jour la classe active sur le menu
              document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
              li.querySelector('a').classList.add('active');

              // Remplacer le contenu principal tout en gardant le style de la carte
              mainContent.innerHTML = `
                <h1 style="color: #f1c40f; margin-bottom: 20px;">${tab.title}</h1>
                <div style="line-height: 1.6;">${tab.content}</div>
              `;
            };
            navUl.appendChild(li);
          });
        }
      }
    });
</script>
</body>
</html>
